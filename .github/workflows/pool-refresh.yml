name: Pool DB refresh

# Wikipedia からの記事プール収集＋連想ペア前計算を定期実行し、
# 成果物 data/difficulty.db.gz を main にコミットする。
# Render は main への push を自動デプロイするため、これがデータ更新→公開の経路になる。
on:
  schedule:
    - cron: '5 3 1 * *' # 毎月1日 12:05 JST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      # 前回コミット分のDBを展開して差分収集に備える
      - name: Restore existing DB
        run: |
          if [ -f data/difficulty.db.gz ]; then
            gzip -dkf data/difficulty.db.gz || echo "::warning::existing archive corrupt, rebuilding from scratch"
          fi

      - name: Collect article pool from Wikipedia
        run: npx tsx src/server/pool-collect.ts --fresh --concurrency 8
        env:
          POOL_LIMIT: ${{ vars.POOL_LIMIT }}

      - name: Precompute associative pairs
        run: npx tsx src/server/assoc.ts

      # 空や著しく縮小したアーカイブを公開しないよう、下限を設けて落とす
      # （現行は pool_articles ~3,179 / assoc_pairs ~488,476。半減以下を異常とみなす）
      - name: Verify pool populated
        run: npx tsx -e "import('./src/server/db').then(m => { m.initDatabase(); const db = m.getDb(); const n = db.prepare('SELECT COUNT(*) c FROM pool_articles').get().c; const p = db.prepare('SELECT COUNT(*) c FROM assoc_pairs').get().c; console.log('pool_articles:', n, 'assoc_pairs:', p); if (n < 1500 || p < 50000) { console.error('pool too small — 収集が途中で失敗した可能性'); process.exit(1) } })"

      - name: Compress DB
        run: gzip -kf data/difficulty.db

      - name: Commit updated DB
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/difficulty.db.gz
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore(data): refresh goal pool DB ($(date +%Y-%m-%d))"
            # 収集中に main が進んでいる場合に備えて rebase してから push
            git pull --rebase
            git push
          fi
