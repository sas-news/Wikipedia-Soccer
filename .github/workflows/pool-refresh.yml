name: Pool DB refresh

# Wikipedia からの記事プール収集＋連想ペア前計算を定期実行し、
# 成果物 data/difficulty.db.gz を main にコミットする。
# Render は main への push を自動デプロイするため、これがデータ更新→公開の経路になる。
on:
  schedule:
    - cron: '5 3 1 * *' # 毎月1日 12:05 JST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      # 前回コミット分のDBを展開。旧難易度テーブル(articles)のスコアを引き継ぐため必須
      # （--fresh はプール系テーブルのみ削除し articles は保持する）
      - name: Restore existing DB
        run: |
          if [ -f data/difficulty.db.gz ]; then
            gzip -dkf data/difficulty.db.gz || echo "::warning::existing archive corrupt, rebuilding from scratch"
          fi

      - name: Collect article pool from Wikipedia
        run: npx tsx src/server/pool-collect.ts --fresh --concurrency 8
        env:
          POOL_LIMIT: ${{ vars.POOL_LIMIT }}

      - name: Precompute associative pairs
        run: npx tsx src/server/assoc.ts

      # アーカイブ無しの初回ビルドでは articles が空なので、旧難易度APIがフォールバック
      # しないようシードする（既にシード済みならスキップされる）
      - name: Seed scoring table if empty
        run: npx tsx -e "import('./src/server/seed').then(m => m.seedDatabase()).catch(e => { console.error(e); process.exit(1) })"

      # seedDatabase は収集失敗を握り潰して正常終了するため、実際に行が入ったか検証。
      # 空のままアーカイブを公開しないよう、0件ならジョブを落とす
      - name: Verify scoring table populated
        run: npx tsx -e "import('./src/server/db').then(m => { m.initDatabase(); const n = m.getArticleCount(); console.log('articles:', n); if (n === 0) process.exit(1) })"

      - name: Compress DB
        run: gzip -kf data/difficulty.db

      - name: Commit updated DB
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/difficulty.db.gz
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore(data): refresh goal pool DB ($(date +%Y-%m-%d))"
            git push
          fi
