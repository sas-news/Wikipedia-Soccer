# Render Blueprint — https://render.com/docs/blueprint-spec
# 「New Blueprint Instance」でこのリポジトリを指定するだけでサービスが作られます。
services:
  - type: web
    name: wikipedia-soccer
    runtime: node
    plan: free
    region: singapore
    branch: main
    # DBはリポジトリに同梱せず GitHub Release "data-latest" からDLして展開する。
    # 取得/展開の失敗はビルドを止めない（ペア出題がフォールバック動作に落ちるだけ）
    buildCommand: npm ci && npm run build && (mkdir -p data && curl -fsSL -o data/difficulty.db.gz https://github.com/sas-news/Wikipedia-Soccer/releases/download/data-latest/difficulty.db.gz && gzip -dkf data/difficulty.db.gz || { rm -f data/difficulty.db data/difficulty.db.gz; echo 'WARNING: DBの取得/展開失敗 — フォールバック出題で起動します'; })
    startCommand: npm run start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "20"
