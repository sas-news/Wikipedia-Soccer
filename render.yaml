# Render Blueprint — https://render.com/docs/blueprint-spec
# 「New Blueprint Instance」でこのリポジトリを指定するだけでサービスが作られます。
services:
  - type: web
    name: wikipedia-soccer
    runtime: node
    plan: free
    region: singapore
    branch: main
    # DB展開失敗はビルドを止めない（ペア出題がフォールバック動作に落ちるだけ）
    buildCommand: npm ci && npm run build && (if [ -f data/difficulty.db.gz ]; then gzip -dkf data/difficulty.db.gz || { rm -f data/difficulty.db; echo 'WARNING: difficulty.db.gz 展開失敗 — フォールバック出題で起動します'; }; fi)
    startCommand: npm run start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "20"
